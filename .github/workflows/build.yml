name: Build Geode Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build adaptive input buffer
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          combine: false
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
